<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Pagamentos | StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info-bg: rgba(59, 130, 246, 0.1);
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --info-color: #2563eb;
            --success-bg: rgba(5, 150, 105, 0.08);
            --error-bg: rgba(220, 38, 38, 0.06);
            --warning-bg: rgba(217, 119, 6, 0.08);
            --info-bg: rgba(37, 99, 235, 0.06);
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --error-color: #dc2626;
                --warning-color: #d97706;
                --info-color: #2563eb;
                --success-bg: rgba(5, 150, 105, 0.08);
                --error-bg: rgba(220, 38, 38, 0.06);
                --warning-bg: rgba(217, 119, 6, 0.08);
                --info-bg: rgba(37, 99, 235, 0.06);
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --info-color: #3b82f6;
                --success-bg: rgba(16, 185, 129, 0.1);
                --error-bg: rgba(239, 68, 68, 0.1);
                --warning-bg: rgba(245, 158, 11, 0.1);
                --info-bg: rgba(59, 130, 246, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-field);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-mix);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--bg-card);
            transition: all 0.3s ease;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-back:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        /* ========== CONTEÚDO ========== */
        .payments-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .page-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* ========== MÉTODOS DE PAGAMENTO ========== */
        .payment-methods-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.3px;
        }

        .payment-methods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .payment-method-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .payment-method-card:hover {
            border-color: var(--text-secondary);
            box-shadow: var(--shadow-card);
        }

        .payment-method-card.default {
            border-color: var(--success-color);
            box-shadow: 0 0 0 1px var(--success-color);
        }

        .payment-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: var(--bg-field);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .payment-info {
            flex: 1;
            min-width: 0;
        }

        .payment-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .payment-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .payment-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: var(--success-bg);
            color: var(--success-color);
        }

        .payment-actions {
            display: flex;
            gap: 0.4rem;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 8px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .btn-icon:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .btn-icon.remove:hover {
            background: var(--error-bg);
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* ========== BOTÃO ADICIONAR ========== */
        .btn-add-payment {
            background: transparent;
            border: 2px dashed var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            font-weight: 500;
            width: 100%;
        }

        .btn-add-payment:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
            background: var(--bg-card);
        }

        /* ========== HISTÓRICO DE PAGAMENTOS ========== */
        .history-section {
            margin-top: 2rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: 14px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            border-color: var(--text-secondary);
        }

        .history-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--bg-field);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-description {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .history-amount {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .history-status {
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .history-status.success {
            background: var(--success-bg);
            color: var(--success-color);
        }

        .history-status.failed {
            background: var(--error-bg);
            color: var(--error-color);
        }

        .history-status.refunded {
            background: var(--info-bg);
            color: var(--info-color);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .payments-container {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.6rem;
            }

            .payment-methods-grid {
                grid-template-columns: 1fr;
            }

            .history-item {
                flex-wrap: wrap;
                gap: 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.4rem;
            }

            .payment-method-card {
                flex-wrap: wrap;
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">▶</div>
                <span class="logo-text">StreamPremium</span>
            </a>

            <div class="header-actions">
                <a href="minha-conta.html" class="btn-back">← Minha conta</a>

                <div class="theme-selector">
                    <button class="theme-option" data-theme-option="dark" type="button">🌙</button>
                    <button class="theme-option" data-theme-option="light" type="button">☀️</button>
                    <button class="theme-option active" data-theme-option="system" type="button">💻</button>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="payments-container">
        <h1 class="page-title">Pagamentos</h1>
        <p class="page-subtitle">Gerencie seus métodos de pagamento e histórico</p>

        <!-- MÉTODOS DE PAGAMENTO -->
        <div class="payment-methods-section">
            <h2 class="section-title">Métodos de pagamento</h2>
            
            <div class="payment-methods-grid" id="paymentMethods">
                <!-- Gerado dinamicamente -->
            </div>

            <button class="btn-add-payment" id="btnAddPayment" style="margin-top:1rem;">
                ➕ Adicionar novo método de pagamento
            </button>
        </div>

        <!-- HISTÓRICO -->
        <div class="history-section">
            <h2 class="section-title">Histórico de pagamentos</h2>
            
            <div class="history-list" id="historyList">
                <!-- Gerado dinamicamente -->
            </div>
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS SIMULADOS ==========
            let metodosPagamento = [
                { id: 1, tipo: 'cartao', nome: 'Cartão de crédito', detalhes: 'Visa •••• 4242', padrao: true },
                { id: 2, tipo: 'pix', nome: 'PIX', detalhes: 'Chave: joao@email.com', padrao: false },
                { id: 3, tipo: 'boleto', nome: 'Boleto bancário', detalhes: 'Gerar boleto', padrao: false },
            ];

            const historicoPagamentos = [
                { id: 1, descricao: 'Assinatura Premium - Dezembro', data: '15/12/2024', valor: 29.90, status: 'success' },
                { id: 2, descricao: 'Compra: Duna Parte 2', data: '10/12/2024', valor: 29.90, status: 'success' },
                { id: 3, descricao: 'Compra: Breaking Bad T1', data: '05/12/2024', valor: 49.90, status: 'success' },
                { id: 4, descricao: 'Tentativa de compra', data: '01/12/2024', valor: 19.90, status: 'failed' },
                { id: 5, descricao: 'Reembolso: A Origem', data: '20/11/2024', valor: -24.90, status: 'refunded' },
                { id: 6, descricao: 'Assinatura Premium - Novembro', data: '15/11/2024', valor: 29.90, status: 'success' },
            ];

            // ========== ELEMENTOS ==========
            const paymentMethods = document.getElementById('paymentMethods');
            const historyList = document.getElementById('historyList');
            const btnAddPayment = document.getElementById('btnAddPayment');

            // ========== FORMATAR PREÇO ==========
            function formatarPreco(valor) {
                const sinal = valor < 0 ? '-' : '';
                return sinal + 'R$ ' + Math.abs(valor).toFixed(2).replace('.', ',');
            }

            // ========== RENDERIZAR MÉTODOS ==========
            function renderizarMetodos() {
                paymentMethods.innerHTML = '';

                metodosPagamento.forEach(metodo => {
                    const card = document.createElement('div');
                    card.className = 'payment-method-card' + (metodo.padrao ? ' default' : '');

                    const icon = metodo.tipo === 'cartao' ? '💳' : 
                                 metodo.tipo === 'pix' ? '⚡' : '📄';

                    card.innerHTML = `
                        <div class="payment-icon">${icon}</div>
                        <div class="payment-info">
                            <p class="payment-name">${metodo.nome}</p>
                            <p class="payment-details">${metodo.detalhes}</p>
                        </div>
                        ${metodo.padrao ? '<span class="payment-badge">✓ Padrão</span>' : ''}
                        <div class="payment-actions">
                            <button class="btn-icon" data-id="${metodo.id}" title="Editar">✏️</button>
                            <button class="btn-icon remove" data-id="${metodo.id}" title="Remover">🗑</button>
                        </div>
                    `;

                    paymentMethods.appendChild(card);
                });

                // Eventos
                document.querySelectorAll('.btn-icon.remove').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        if (confirm('Remover este método de pagamento?')) {
                            metodosPagamento = metodosPagamento.filter(m => m.id !== id);
                            renderizarMetodos();
                        }
                    });
                });

                document.querySelectorAll('.btn-icon:not(.remove)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        alert('Editar método de pagamento');
                    });
                });
            }

            // ========== RENDERIZAR HISTÓRICO ==========
            function renderizarHistorico() {
                historyList.innerHTML = '';

                historicoPagamentos.forEach(pagamento => {
                    const item = document.createElement('div');
                    item.className = 'history-item';

                    const statusLabel = pagamento.status === 'success' ? 'Pago' : 
                                       pagamento.status === 'failed' ? 'Falhou' : 'Reembolsado';

                    const statusIcon = pagamento.status === 'success' ? '✓' : 
                                       pagamento.status === 'failed' ? '✗' : '↩';

                    const icon = pagamento.status === 'refunded' ? '↩️' : 
                                 pagamento.status === 'failed' ? '❌' : '💳';

                    item.innerHTML = `
                        <div class="history-icon">${icon}</div>
                        <div class="history-info">
                            <p class="history-description">${pagamento.descricao}</p>
                            <p class="history-date">${pagamento.data}</p>
                        </div>
                        <span class="history-amount">${formatarPreco(pagamento.valor)}</span>
                        <span class="history-status ${pagamento.status}">
                            ${statusIcon} ${statusLabel}
                        </span>
                    `;

                    historyList.appendChild(item);
                });
            }

            // ========== ADICIONAR MÉTODO ==========
            btnAddPayment.addEventListener('click', function() {
                alert('Adicionar novo método de pagamento - recurso em desenvolvimento');
            });

            // ========== INICIALIZAR ==========
            renderizarMetodos();
            renderizarHistorico();
        })();
    </script>
</body>
</html>
