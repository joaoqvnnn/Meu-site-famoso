<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Catálogo | StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --hover-overlay: rgba(255, 255, 255, 0.05);
            --badge-bg: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb: #333333;
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --hover-overlay: rgba(0, 0, 0, 0.03);
            --badge-bg: rgba(0, 0, 0, 0.06);
            --scrollbar-thumb: #cccccc;
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --hover-overlay: rgba(0, 0, 0, 0.03);
                --badge-bg: rgba(0, 0, 0, 0.06);
                --scrollbar-thumb: #cccccc;
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --hover-overlay: rgba(255, 255, 255, 0.05);
                --badge-bg: rgba(255, 255, 255, 0.1);
                --scrollbar-thumb: #333333;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-mix);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--bg-card);
            transition: all 0.3s ease;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-field);
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1rem;
            gap: 0.5rem;
            min-width: 250px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 3px rgba(128, 128, 128, 0.08);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            font-family: var(--font-sans);
        }

        .search-box input::placeholder {
            color: var(--text-placeholder);
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-logout:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        /* ========== BANNER DESTAQUE ========== */
        .featured-banner {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 2rem;
        }

        .featured-content {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.7s ease;
            position: relative;
            overflow: hidden;
        }

        .featured-badge {
            display: inline-block;
            background: var(--badge-bg);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .featured-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .featured-description {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 1.5rem;
        }

        .btn-play {
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            letter-spacing: 0.3px;
        }

        .btn-play:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* ========== CATEGORIAS ========== */
        .categories-nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem 0.5rem;
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .category-chip:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .category-chip.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
            font-weight: 600;
        }

        /* ========== CATÁLOGO ========== */
        .catalog {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem 2rem;
        }

        .catalog-header {
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease;
        }

        .catalog-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .catalog-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s ease;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-card);
            border-color: var(--text-secondary);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--bg-field);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-poster-placeholder {
            font-size: 3rem;
            opacity: 0.3;
        }

        .movie-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--badge-bg);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 0.3rem 0.6rem;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .movie-info {
            padding: 0.9rem;
        }

        .movie-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .movie-rating {
            color: #f59e0b;
            font-weight: 600;
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .search-box {
                min-width: auto;
                flex: 1;
            }

            .featured-banner {
                padding: 0 1rem;
                margin-top: 1rem;
            }

            .featured-content {
                padding: 2rem 1.5rem;
            }

            .featured-title {
                font-size: 1.8rem;
            }

            .categories-nav {
                padding: 1rem 1rem 0.5rem;
            }

            .catalog {
                padding: 1rem;
            }

            .catalog-title {
                font-size: 1.3rem;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .movies-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }

            .theme-option {
                padding: 0.35rem 0.6rem;
                font-size: 0.65rem;
            }

            .movie-title {
                font-size: 0.8rem;
            }

            .movie-info {
                padding: 0.7rem;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">▶</div>

                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Buscar filmes e séries...">
                </div>

                <div class="theme-selector">
                    <button class="theme-option" data-theme-option="dark" type="button">🌙</button>
                    <button class="theme-option" data-theme-option="light" type="button">☀️</button>
                    <button class="theme-option active" data-theme-option="system" type="button">💻</button>
                </div>

                <a href="login.html" class="btn-logout">👤 Sair</a>
            </div>
        </div>
    </header>

    <!-- BANNER DESTAQUE -->
    <section class="featured-banner">
        <div class="featured-content">
            <span class="featured-badge">⭐ DESTAQUE</span>
            <h1 class="featured-title">Duna: Parte 2</h1>
            <p class="featured-description">
                A jornada de Paul Atreides continua em uma aventura épica 
                repleta de ação, drama e efeitos visuais impressionantes.
            </p>
            <button class="btn-play" id="btnPlayFeatured">
                ▶ Assistir agora
            </button>
        </div>
    </section>

    <!-- CATEGORIAS -->
    <nav class="categories-nav" id="categoriesNav">
        <button class="category-chip active" data-category="todos">Todos</button>
        <button class="category-chip" data-category="filmes">Filmes</button>
        <button class="category-chip" data-category="series">Séries</button>
        <button class="category-chip" data-category="documentarios">Documentários</button>
        <button class="category-chip" data-category="animacao">Animação</button>
        <button class="category-chip" data-category="acao">Ação</button>
        <button class="category-chip" data-category="comedia">Comédia</button>
        <button class="category-chip" data-category="drama">Drama</button>
        <button class="category-chip" data-category="ficcao">Ficção Científica</button>
        <button class="category-chip" data-category="terror">Terror</button>
    </nav>

    <!-- CATÁLOGO -->
    <main class="catalog">
        <div class="catalog-header">
            <h2 class="catalog-title">Catálogo</h2>
            <p class="catalog-subtitle" id="catalogSubtitle">Todos os títulos disponíveis</p>
        </div>

        <div class="movies-grid" id="moviesGrid">
            <!-- Os cards serão gerados dinamicamente -->
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS DE FILMES (SIMULADOS) ==========
            const catalogo = [
                { id: 1, titulo: 'A Origem', categoria: 'filmes', genero: 'ficcao', ano: 2010, avaliacao: 8.8 },
                { id: 2, titulo: 'Breaking Bad', categoria: 'series', genero: 'drama', ano: 2008, avaliacao: 9.5 },
                { id: 3, titulo: 'Planeta Terra II', categoria: 'documentarios', genero: 'documentarios', ano: 2016, avaliacao: 9.5 },
                { id: 4, titulo: 'Toy Story 4', categoria: 'animacao', genero: 'animacao', ano: 2019, avaliacao: 7.8 },
                { id: 5, titulo: 'John Wick 4', categoria: 'filmes', genero: 'acao', ano: 2023, avaliacao: 8.1 },
                { id: 6, titulo: 'The Office', categoria: 'series', genero: 'comedia', ano: 2005, avaliacao: 9.0 },
                { id: 7, titulo: 'Interestelar', categoria: 'filmes', genero: 'ficcao', ano: 2014, avaliacao: 8.7 },
                { id: 8, titulo: 'Stranger Things', categoria: 'series', genero: 'terror', ano: 2016, avaliacao: 8.7 },
                { id: 9, titulo: 'Oppenheimer', categoria: 'filmes', genero: 'drama', ano: 2023, avaliacao: 8.6 },
                { id: 10, titulo: 'Rick and Morty', categoria: 'animacao', genero: 'animacao', ano: 2013, avaliacao: 9.1 },
                { id: 11, titulo: 'Duna: Parte 2', categoria: 'filmes', genero: 'ficcao', ano: 2024, avaliacao: 8.9 },
                { id: 12, titulo: 'The Last of Us', categoria: 'series', genero: 'drama', ano: 2023, avaliacao: 8.8 },
                { id: 13, titulo: 'Missão Impossível 7', categoria: 'filmes', genero: 'acao', ano: 2023, avaliacao: 7.9 },
                { id: 14, titulo: 'Friends', categoria: 'series', genero: 'comedia', ano: 1994, avaliacao: 8.9 },
                { id: 15, titulo: 'Cosmos', categoria: 'documentarios', genero: 'documentarios', ano: 2014, avaliacao: 9.3 },
                { id: 16, titulo: 'A Sociedade da Neve', categoria: 'filmes', genero: 'drama', ano: 2023, avaliacao: 7.9 },
                { id: 17, titulo: 'Demon Slayer', categoria: 'animacao', genero: 'animacao', ano: 2019, avaliacao: 8.5 },
                { id: 18, titulo: 'O Massacre da Serra Elétrica', categoria: 'filmes', genero: 'terror', ano: 1974, avaliacao: 7.4 },
                { id: 19, titulo: 'Suits', categoria: 'series', genero: 'drama', ano: 2011, avaliacao: 8.4 },
                { id: 20, titulo: 'Mad Max: Estrada da Fúria', categoria: 'filmes', genero: 'acao', ano: 2015, avaliacao: 8.1 },
                { id: 21, titulo: 'One Piece', categoria: 'animacao', genero: 'animacao', ano: 1999, avaliacao: 8.9 },
                { id: 22, titulo: 'O Dilema das Redes', categoria: 'documentarios', genero: 'documentarios', ano: 2020, avaliacao: 7.6 },
                { id: 23, titulo: 'Hereditário', categoria: 'filmes', genero: 'terror', ano: 2018, avaliacao: 7.3 },
                { id: 24, titulo: 'Ted Lasso', categoria: 'series', genero: 'comedia', ano: 2020, avaliacao: 8.8 },
            ];

            // ========== ELEMENTOS ==========
            const moviesGrid = document.getElementById('moviesGrid');
            const categoryChips = document.querySelectorAll('.category-chip');
            const searchInput = document.getElementById('searchInput');
            const catalogSubtitle = document.getElementById('catalogSubtitle');
            const btnPlayFeatured = document.getElementById('btnPlayFeatured');

            let categoriaAtual = 'todos';
            let termoBusca = '';

            // ========== RENDERIZAR FILMES ==========
            function renderizarFilmes() {
                let filmesFiltrados = catalogo;

                // Filtrar por categoria
                if (categoriaAtual !== 'todos') {
                    filmesFiltrados = filmesFiltrados.filter(filme => {
                        if (categoriaAtual === 'filmes') return filme.categoria === 'filmes';
                        if (categoriaAtual === 'series') return filme.categoria === 'series';
                        if (categoriaAtual === 'documentarios') return filme.categoria === 'documentarios';
                        if (categoriaAtual === 'animacao') return filme.genero === 'animacao';
                        if (categoriaAtual === 'acao') return filme.genero === 'acao';
                        if (categoriaAtual === 'comedia') return filme.genero === 'comedia';
                        if (categoriaAtual === 'drama') return filme.genero === 'drama';
                        if (categoriaAtual === 'ficcao') return filme.genero === 'ficcao';
                        if (categoriaAtual === 'terror') return filme.genero === 'terror';
                        return true;
                    });
                }

                // Filtrar por busca
                if (termoBusca) {
                    filmesFiltrados = filmesFiltrados.filter(filme =>
                        filme.titulo.toLowerCase().includes(termoBusca.toLowerCase())
                    );
                }

                // Atualizar subtítulo
                if (categoriaAtual === 'todos') {
                    catalogSubtitle.textContent = 'Todos os títulos disponíveis';
                } else {
                    const nomes = {
                        'filmes': 'Filmes',
                        'series': 'Séries',
                        'documentarios': 'Documentários',
                        'animacao': 'Animação',
                        'acao': 'Ação',
                        'comedia': 'Comédia',
                        'drama': 'Drama',
                        'ficcao': 'Ficção Científica',
                        'terror': 'Terror'
                    };
                    catalogSubtitle.textContent = nomes[categoriaAtual] || categoriaAtual;
                }

                // Limpar grid
                moviesGrid.innerHTML = '';

                if (filmesFiltrados.length === 0) {
                    moviesGrid.innerHTML = '<p style="text-align:center;color:var(--text-secondary);grid-column:1/-1;padding:2rem;">Nenhum título encontrado</p>';
                    return;
                }

                // Renderizar cards
                filmesFiltrados.forEach((filme, index) => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.style.animationDelay = (index * 0.04) + 's';
                    
                    const categoriaLabel = filme.categoria === 'filmes' ? 'FILME' : 
                                          filme.categoria === 'series' ? 'SÉRIE' : 
                                          filme.categoria === 'documentarios' ? 'DOC' : 
                                          'ANIME';
                    
                    card.innerHTML = `
                        <div class="movie-poster">
                            <span class="movie-poster-placeholder">🎬</span>
                            <span class="movie-badge">${categoriaLabel}</span>
                        </div>
                        <div class="movie-info">
                            <h3 class="movie-title">${filme.titulo}</h3>
                            <div class="movie-meta">
                                <span>${filme.ano}</span>
                                <span>•</span>
                                <span class="movie-rating">★ ${filme.avaliacao}</span>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', function() {
                        // Futuro: redirecionar para página do filme
                        // window.location.href = 'filme.html?id=' + filme.id;
                        alert('Abrir: ' + filme.titulo);
                    });
                    
                    moviesGrid.appendChild(card);
                });
            }

            // ========== EVENTOS DE CATEGORIA ==========
            categoryChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    categoryChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    categoriaAtual = this.getAttribute('data-category');
                    renderizarFilmes();
                });
            });

            // ========== EVENTO DE BUSCA ==========
            searchInput.addEventListener('input', function() {
                termoBusca = this.value.trim();
                renderizarFilmes();
            });

            // ========== BOTÃO DESTAQUE ==========
            btnPlayFeatured.addEventListener('click', function() {
                alert('Reproduzir: Duna - Parte 2');
            });

            // ========== INICIALIZAR ==========
            renderizarFilmes();
        })();
    </script>
</body>
</html>
