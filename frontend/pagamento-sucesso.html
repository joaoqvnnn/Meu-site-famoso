<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Pagamento Confirmado | StreamPremium</title>
    <style>
        :root {
            --radius-card: 28px;
            --radius-btn: 14px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --border-field: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --confetti-color: #f59e0b;
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --border-field: #e4e4e4;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --success-bg: rgba(5, 150, 105, 0.08);
            --confetti-color: #d97706;
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --border-field: #e4e4e4;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --success-bg: rgba(5, 150, 105, 0.08);
                --confetti-color: #d97706;
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --border-field: #2a2a2a;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
                --success-color: #10b981;
                --success-bg: rgba(16, 185, 129, 0.1);
                --confetti-color: #f59e0b;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            position: relative;
        }

        /* ========== CONFETES ========== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall 3s ease-in-out infinite;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* ========== CARD ========== */
        .success-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.7s cubic-bezier(0.2, 0, 0, 1) 0.2s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            background: var(--bg-card);
            border-radius: 50px;
            padding: 0.4rem;
            border: 1px solid var(--border-mix);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            opacity: 0;
            animation: fadeInUp 0.5s ease 0.1s forwards;
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 0.45rem 1.1rem;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
            background: rgba(128, 128, 128, 0.08);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        .theme-icon {
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 3rem 2rem;
            border: 1px solid var(--border-mix);
            text-align: center;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.7s ease 0.3s forwards;
        }

        /* ========== ÍCONE DE SUCESSO ========== */
        .success-icon-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--success-bg);
            border: 3px solid var(--success-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: successPulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes successPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }
        }

        .success-icon {
            font-size: 3rem;
            animation: checkmarkAppear 0.5s ease 0.5s both;
        }

        @keyframes checkmarkAppear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ========== TÍTULO ========== */
        .success-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--success-color);
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        .success-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* ========== DETALHES DO PEDIDO ========== */
        .order-details {
            background: var(--bg-field);
            border: 1px solid var(--border-mix);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .detail-row:not(:last-child) {
            border-bottom: 1px solid var(--border-mix);
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ========== BOTÕES ========== */
        .btn-primary {
            width: 100%;
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 1.1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-btn);
            padding: 0.9rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.75rem;
            }
            .card {
                padding: 2rem 1.5rem;
                border-radius: 24px;
            }
            .success-title {
                font-size: 1.8rem;
            }
            .success-icon-container {
                width: 80px;
                height: 80px;
            }
            .success-icon {
                font-size: 2.5rem;
            }
            .theme-option {
                padding: 0.35rem 0.8rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- CONFETES -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- CONTEÚDO -->
    <div class="success-wrapper">
        <!-- Seletor de tema -->
        <div class="theme-selector">
            <button class="theme-option" data-theme-option="dark" type="button">
                <span class="theme-icon">🌙</span> Preto
            </button>
            <button class="theme-option" data-theme-option="light" type="button">
                <span class="theme-icon">☀️</span> Branco
            </button>
            <button class="theme-option active" data-theme-option="system" type="button">
                <span class="theme-icon">💻</span> Sistema
            </button>
        </div>

        <!-- Card de sucesso -->
        <div class="card">
            <!-- Ícone -->
            <div class="success-icon-container">
                <span class="success-icon">✅</span>
            </div>

            <!-- Título -->
            <h1 class="success-title">Pagamento confirmado!</h1>
            <p class="success-subtitle">
                Sua compra foi realizada com sucesso.<br>
                Um e-mail de confirmação foi enviado para você.
            </p>

            <!-- Detalhes do pedido -->
            <div class="order-details">
                <div class="detail-row">
                    <span class="detail-label">Número do pedido</span>
                    <span class="detail-value" id="orderNumber">#SP-2024-001234</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Data</span>
                    <span class="detail-value" id="orderDate">15/12/2024</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Método de pagamento</span>
                    <span class="detail-value" id="paymentMethod">Cartão de crédito</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total pago</span>
                    <span class="detail-value" id="orderTotal">R$ 99,70</span>
                </div>
            </div>

            <!-- Ações -->
            <a href="catalogo.html" class="btn-primary">
                🎬 Começar a assistir
            </a>
            <a href="index.html" class="btn-secondary">
                ← Voltar para o início
            </a>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== GERAR CONFETES ==========
            function gerarConfetes() {
                const container = document.getElementById('confettiContainer');
                const cores = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6'];
                
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
                    confetti.style.width = (Math.random() * 8 + 4) + 'px';
                    confetti.style.height = (Math.random() * 8 + 4) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 3) + 's';
                    
                    container.appendChild(confetti);
                }
            }

            // ========== DADOS DO PEDIDO ==========
            function gerarDadosPedido() {
                // Tentar carregar dados do localStorage
                try {
                    const pedidoSalvo = localStorage.getItem('streampremium_pedido');
                    if (pedidoSalvo) {
                        const pedido = JSON.parse(pedidoSalvo);
                        if (pedido.numero) {
                            document.getElementById('orderNumber').textContent = pedido.numero;
                        }
                        if (pedido.total) {
                            document.getElementById('orderTotal').textContent = pedido.total;
                        }
                        if (pedido.metodo) {
                            document.getElementById('paymentMethod').textContent = pedido.metodo;
                        }
                        if (pedido.data) {
                            document.getElementById('orderDate').textContent = pedido.data;
                        }
                    }
                } catch (e) {
                    // Usar dados padrão
                }
                
                // Atualizar data atual
                const hoje = new Date();
                const dataFormatada = hoje.toLocaleDateString('pt-BR');
                document.getElementById('orderDate').textContent = dataFormatada;
            }

            // ========== INICIALIZAR ==========
            gerarConfetes();
            gerarDadosPedido();
        })();
    </script>
</body>
</html>
