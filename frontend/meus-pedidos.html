<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Meus Pedidos | StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info-bg: rgba(59, 130, 246, 0.1);
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --info-color: #2563eb;
            --success-bg: rgba(5, 150, 105, 0.08);
            --error-bg: rgba(220, 38, 38, 0.06);
            --warning-bg: rgba(217, 119, 6, 0.08);
            --info-bg: rgba(37, 99, 235, 0.06);
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --error-color: #dc2626;
                --warning-color: #d97706;
                --info-color: #2563eb;
                --success-bg: rgba(5, 150, 105, 0.08);
                --error-bg: rgba(220, 38, 38, 0.06);
                --warning-bg: rgba(217, 119, 6, 0.08);
                --info-bg: rgba(37, 99, 235, 0.06);
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --info-color: #3b82f6;
                --success-bg: rgba(16, 185, 129, 0.1);
                --error-bg: rgba(239, 68, 68, 0.1);
                --warning-bg: rgba(245, 158, 11, 0.1);
                --info-bg: rgba(59, 130, 246, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-field);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-mix);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--bg-card);
            transition: all 0.3s ease;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-back:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        /* ========== CONTEÚDO ========== */
        .orders-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .page-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* ========== FILTROS ========== */
        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .filter-chip:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .filter-chip.active {
            background: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
            font-weight: 600;
        }

        /* ========== LISTA DE PEDIDOS ========== */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .order-card:hover {
            border-color: var(--text-secondary);
            box-shadow: var(--shadow-card);
        }

        .order-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .order-number {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .order-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .order-status {
            padding: 0.35rem 0.9rem;
            border-radius: 15px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .order-status.entregue {
            background: var(--success-bg);
            color: var(--success-color);
        }

        .order-status.pendente {
            background: var(--warning-bg);
            color: var(--warning-color);
        }

        .order-status.processando {
            background: var(--info-bg);
            color: var(--info-color);
        }

        .order-status.cancelado {
            background: var(--error-bg);
            color: var(--error-color);
        }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.85rem;
        }

        .order-item-icon {
            width: 35px;
            height: 45px;
            background: var(--bg-field);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .order-item-info {
            flex: 1;
            min-width: 0;
        }

        .order-item-title {
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-item-price {
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid var(--border-mix);
        }

        .order-total {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .order-total strong {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .order-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-action:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        .btn-action.details {
            background: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
        }

        .btn-action.details:hover {
            background: var(--bg-btn-hover);
            border-color: var(--bg-btn-hover);
        }

        /* ========== VAZIO ========== */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .empty-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .btn-browse {
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-browse:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .orders-container {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.6rem;
            }

            .filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.4rem;
            }

            .order-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-actions {
                width: 100%;
            }

            .btn-action {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- HEADER -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">▶</div>
                <span class="logo-text">StreamPremium</span>
            </a>

            <div class="header-actions">
                <a href="minha-conta.html" class="btn-back">← Minha conta</a>

                <div class="theme-selector">
                    <button class="theme-option" data-theme-option="dark" type="button">🌙</button>
                    <button class="theme-option" data-theme-option="light" type="button">☀️</button>
                    <button class="theme-option active" data-theme-option="system" type="button">💻</button>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="orders-container">
        <h1 class="page-title">Meus pedidos</h1>
        <p class="page-subtitle">Acompanhe o status de todos os seus pedidos</p>

        <!-- FILTROS -->
        <div class="filters" id="filters">
            <button class="filter-chip active" data-filter="todos">Todos</button>
            <button class="filter-chip" data-filter="entregue">Entregues</button>
            <button class="filter-chip" data-filter="pendente">Pendentes</button>
            <button class="filter-chip" data-filter="processando">Processando</button>
            <button class="filter-chip" data-filter="cancelado">Cancelados</button>
        </div>

        <!-- LISTA DE PEDIDOS -->
        <div class="orders-list" id="ordersList">
            <!-- Gerado dinamicamente -->
        </div>

        <!-- ESTADO VAZIO -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📦</div>
            <h2 class="empty-title">Nenhum pedido encontrado</h2>
            <p class="empty-text">Você não possui pedidos nesta categoria</p>
            <a href="catalogo.html" class="btn-browse">🎬 Explorar catálogo</a>
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS SIMULADOS ==========
            const pedidos = [
                {
                    id: 1,
                    numero: '#SP-2024-001234',
                    data: '15/12/2024',
                    status: 'entregue',
                    itens: [
                        { titulo: 'Duna: Parte 2', preco: 29.90 },
                        { titulo: 'Interestelar', preco: 19.90 }
                    ],
                    total: 49.80
                },
                {
                    id: 2,
                    numero: '#SP-2024-001198',
                    data: '10/12/2024',
                    status: 'processando',
                    itens: [
                        { titulo: 'Breaking Bad - Temporada 1', preco: 49.90 }
                    ],
                    total: 49.90
                },
                {
                    id: 3,
                    numero: '#SP-2024-001150',
                    data: '05/12/2024',
                    status: 'entregue',
                    itens: [
                        { titulo: 'A Origem', preco: 24.90 }
                    ],
                    total: 24.90
                },
                {
                    id: 4,
                    numero: '#SP-2024-001089',
                    data: '01/12/2024',
                    status: 'pendente',
                    itens: [
                        { titulo: 'Stranger Things - T1', preco: 39.90 }
                    ],
                    total: 39.90
                },
                {
                    id: 5,
                    numero: '#SP-2024-001034',
                    data: '20/11/2024',
                    status: 'cancelado',
                    itens: [
                        { titulo: 'Planeta Terra II', preco: 34.90 }
                    ],
                    total: 34.90
                },
                {
                    id: 6,
                    numero: '#SP-2024-000987',
                    data: '15/11/2024',
                    status: 'entregue',
                    itens: [
                        { titulo: 'Toy Story 4', preco: 19.90 },
                        { titulo: 'Rick and Morty - T1', preco: 29.90 }
                    ],
                    total: 49.80
                }
            ];

            let filtroAtual = 'todos';

            // ========== ELEMENTOS ==========
            const ordersList = document.getElementById('ordersList');
            const emptyState = document.getElementById('emptyState');
            const filterChips = document.querySelectorAll('.filter-chip');

            // ========== FORMATAR PREÇO ==========
            function formatarPreco(valor) {
                return 'R$ ' + valor.toFixed(2).replace('.', ',');
            }

            // ========== RENDERIZAR PEDIDOS ==========
            function renderizarPedidos() {
                let pedidosFiltrados = pedidos;
                
                if (filtroAtual !== 'todos') {
                    pedidosFiltrados = pedidos.filter(p => p.status === filtroAtual);
                }

                ordersList.innerHTML = '';

                if (pedidosFiltrados.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';

                pedidosFiltrados.forEach((pedido, index) => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.style.animationDelay = (index * 0.08) + 's';

                    const statusLabel = pedido.status.charAt(0).toUpperCase() + pedido.status.slice(1);
                    const statusIcon = pedido.status === 'entregue' ? '✓' : 
                                      pedido.status === 'pendente' ? '⏳' : 
                                      pedido.status === 'processando' ? '🔄' : '✗';

                    const itensHTML = pedido.itens.map(item => `
                        <div class="order-item">
                            <div class="order-item-icon">🎬</div>
                            <div class="order-item-info">
                                <p class="order-item-title">${item.titulo}</p>
                            </div>
                            <span class="order-item-price">${formatarPreco(item.preco)}</span>
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="order-header">
                            <div>
                                <p class="order-number">${pedido.numero}</p>
                                <p class="order-date">${pedido.data}</p>
                            </div>
                            <span class="order-status ${pedido.status}">
                                ${statusIcon} ${statusLabel}
                            </span>
                        </div>

                        <div class="order-items">
                            ${itensHTML}
                        </div>

                        <div class="order-footer">
                            <p class="order-total">
                                Total: <strong>${formatarPreco(pedido.total)}</strong>
                            </p>
                            <div class="order-actions">
                                <button class="btn-action details" data-id="${pedido.id}">
                                    📄 Detalhes
                                </button>
                                <button class="btn-action" data-id="${pedido.id}">
                                    🔄 Rastrear
                                </button>
                            </div>
                        </div>
                    `;

                    ordersList.appendChild(card);
                });

                // Eventos dos botões
                document.querySelectorAll('.btn-action.details').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        const pedido = pedidos.find(p => p.id === id);
                        if (pedido) {
                            alert('Detalhes do pedido ' + pedido.numero);
                        }
                    });
                });
            }

            // ========== EVENTOS DE FILTRO ==========
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    filtroAtual = this.getAttribute('data-filter');
                    renderizarPedidos();
                });
            });

            // ========== INICIALIZAR ==========
            renderizarPedidos();
        })();
    </script>
</body>
</html>
