<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Gerenciar Usuários | Admin StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --radius-field: 12px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --border-field-focus: #ffffff;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info-bg: rgba(59, 130, 246, 0.1);
            --admin-badge: #f59e0b;
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --border-field-focus: #171717;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --info-color: #2563eb;
            --success-bg: rgba(5, 150, 105, 0.08);
            --error-bg: rgba(220, 38, 38, 0.06);
            --warning-bg: rgba(217, 119, 6, 0.08);
            --info-bg: rgba(37, 99, 235, 0.06);
            --admin-badge: #d97706;
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --border-field-focus: #171717;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --error-color: #dc2626;
                --warning-color: #d97706;
                --info-color: #2563eb;
                --success-bg: rgba(5, 150, 105, 0.08);
                --error-bg: rgba(220, 38, 38, 0.06);
                --warning-bg: rgba(217, 119, 6, 0.08);
                --info-bg: rgba(37, 99, 235, 0.06);
                --admin-badge: #d97706;
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --border-field-focus: #ffffff;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --info-color: #3b82f6;
                --success-bg: rgba(16, 185, 129, 0.1);
                --error-bg: rgba(239, 68, 68, 0.1);
                --warning-bg: rgba(245, 158, 11, 0.1);
                --info-bg: rgba(59, 130, 246, 0.1);
                --admin-badge: #f59e0b;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-field);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        /* ========== HEADER ADMIN ========== */
        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 2px solid var(--admin-badge);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.5s ease;
        }

        .admin-header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .admin-logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--admin-badge);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #000000;
        }

        .admin-logo-text {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .admin-badge {
            display: inline-block;
            background: var(--warning-bg);
            border: 1px solid var(--warning-color);
            border-radius: 15px;
            padding: 0.25rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--warning-color);
            letter-spacing: 0.3px;
        }

        .admin-nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .admin-nav-link {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .admin-nav-link:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .admin-nav-link.active {
            background: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
            font-weight: 600;
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.35rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        /* ========== CONTEÚDO ========== */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .btn-add {
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* ========== ESTATÍSTICAS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.2rem;
            text-align: center;
        }

        .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ========== BUSCA ========== */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-field);
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 3px rgba(128, 128, 128, 0.08);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            font-family: var(--font-sans);
        }

        /* ========== TABELA DE USUÁRIOS ========== */
        .users-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            overflow: hidden;
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 700px;
        }

        .users-table th {
            background: var(--bg-field);
            padding: 0.9rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .users-table td {
            padding: 0.8rem 1rem;
            border-top: 1px solid var(--border-mix);
            color: var(--text-secondary);
        }

        .users-table tr:hover td {
            background: var(--bg-field);
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--bg-field);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-email {
            font-size: 0.8rem;
        }

        .status-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-badge.ativo {
            background: var(--success-bg);
            color: var(--success-color);
        }

        .status-badge.inativo {
            background: var(--error-bg);
            color: var(--error-color);
        }

        .status-badge.pendente {
            background: var(--warning-bg);
            color: var(--warning-color);
        }

        .plan-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: var(--info-bg);
            color: var(--info-color);
        }

        .action-buttons {
            display: flex;
            gap: 0.4rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .btn-action:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .btn-action.delete:hover {
            background: var(--error-bg);
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .admin-header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .admin-nav {
                width: 100%;
                justify-content: center;
            }

            .admin-container {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.3rem;
            }

            .btn-add {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

    <!-- HEADER ADMIN -->
    <header class="admin-header">

    <!-- CONTEÚDO -->
    <main class="admin-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Gerenciar Usuários</h1>
                <p class="page-subtitle">Visualize, edite e gerencie todos os usuários da plataforma</p>

                ➕ Adicionar usuário
            </button>

            <div class="stat-card">

                <div class="stat-icon">🚫</div>

        <!-- TABELA -->
        <div class="users-table-container">

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_admin_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS SIMULADOS ==========
            let usuarios = [
                { id: 1, nome: 'João da Silva', email: 'joao.silva@email.com', plano: 'Premium', status: 'ativo', cadastro: '15/01/2024' },
                { id: 2, nome: 'Maria Oliveira', email: 'maria.oliveira@email.com', plano: 'Básico', status: 'ativo', cadastro: '22/02/2024' },
                { id: 3, nome: 'Pedro Santos', email: 'pedro.santos@email.com', plano: 'Família', status: 'pendente', cadastro: '10/03/2024' },
                { id: 4, nome: 'Ana Costa', email: 'ana.costa@email.com', plano: 'Premium', status: 'ativo', cadastro: '05/04/2024' },
                { id: 5, nome: 'Carlos Pereira', email: 'carlos.pereira@email.com', plano: 'Básico', status: 'inativo', cadastro: '18/05/2024' },
                { id: 6, nome: 'Juliana Almeida', email: 'juliana.almeida@email.com', plano: 'Premium', status: 'ativo', cadastro: '30/06/2024' },
                { id: 7, nome: 'Roberto Nunes', email: 'roberto.nunes@email.com', plano: 'Família', status: 'ativo', cadastro: '12/07/2024' },
                { id: 8, nome: 'Fernanda Lima', email: 'fernanda.lima@email.com', plano: 'Básico', status: 'pendente', cadastro: '25/08/2024' },
            ];

            // ========== ELEMENTOS ==========
            const usersTableBody = document.getElementById('usersTableBody');
            const searchInput = document.getElementById('searchUser');
            const btnAddUser = document.getElementById('btnAddUser');

            // ========== RENDERIZAR USUÁRIOS ==========
            function renderizarUsuarios(filtro = '') {
                usersTableBody.innerHTML = '';

                const usuariosFiltrados = usuarios.filter(usuario => {
                    if (!filtro) return true;
                    const termo = filtro.toLowerCase();
                    return usuario.nome.toLowerCase().includes(termo) ||
                           usuario.email.toLowerCase().includes(termo);
                });

                usuariosFiltrados.forEach(usuario => {
                    const tr = document.createElement('tr');

                    const statusLabel = usuario.status.charAt(0).toUpperCase() + usuario.status.slice(1);
                    const statusIcon = usuario.status === 'ativo' ? '✓' : usuario.status === 'pendente' ? '⏳' : '✗';

                    tr.innerHTML = `
                        <td>
                            <div class="user-info">
                                <div class="user-avatar">👤</div>
                                <span class="user-name">${usuario.nome}</span>
                            </div>
                        </td>
                        <td class="user-email">${usuario.email}</td>
                        <td><span class="plan-badge">${usuario.plano}</span></td>
                        <td><span class="status-badge ${usuario.status}">${statusIcon} ${statusLabel}</span></td>
                        <td>${usuario.cadastro}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-action" data-id="${usuario.id}" title="Editar">✏️</button>
                                <button class="btn-action delete" data-id="${usuario.id}" title="Excluir">🗑</button>
                            </div>
                        </td>
                    `;

                    usersTableBody.appendChild(tr);
                });

                // Eventos dos botões
                document.querySelectorAll('.btn-action:not(.delete)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        alert('Editar usuário ID: ' + id);
                    });
                });

                document.querySelectorAll('.btn-action.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        if (confirm('Excluir este usuário?')) {
                            usuarios = usuarios.filter(u => u.id !== id);
                            renderizarUsuarios(searchInput.value);
                            atualizarEstatisticas();
                        }
                    });
                });
            }

            // ========== ATUALIZAR ESTATÍSTICAS ==========
            function atualizarEstatisticas() {
                document.getElementById('statTotal').textContent = usuarios.length.toLocaleString();
                document.getElementById('statAtivos').textContent = usuarios.filter(u => u.status === 'ativo').length.toLocaleString();
                document.getElementById('statPendentes').textContent = usuarios.filter(u => u.status === 'pendente').length.toLocaleString();
                document.getElementById('statInativos').textContent = usuarios.filter(u => u.status === 'inativo').length.toLocaleString();
            }

            // ========== BUSCA ==========
            searchInput.addEventListener('input', function() {
                renderizarUsuarios(this.value);
            });

            // ========== ADICIONAR USUÁRIO ==========
            btnAddUser.addEventListener('click', function() {
                alert('Adicionar novo usuário - formulário em desenvolvimento');
            });

            // ========== INICIALIZAR ==========
            renderizarUsuarios();
            atualizarEstatisticas();
        })();
    </script>
</body>
</html>
