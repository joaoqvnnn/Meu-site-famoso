<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Gerenciar Administradores | Admin StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --radius-field: 12px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --border-field-focus: #ffffff;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info-bg: rgba(59, 130, 246, 0.1);
            --admin-badge: #f59e0b;
            --role-admin: #f59e0b;
            --role-super: #ef4444;
            --role-mod: #3b82f6;
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --border-field-focus: #171717;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --info-color: #2563eb;
            --success-bg: rgba(5, 150, 105, 0.08);
            --error-bg: rgba(220, 38, 38, 0.06);
            --warning-bg: rgba(217, 119, 6, 0.08);
            --info-bg: rgba(37, 99, 235, 0.06);
            --admin-badge: #d97706;
            --role-admin: #d97706;
            --role-super: #dc2626;
            --role-mod: #2563eb;
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --border-field-focus: #171717;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --error-color: #dc2626;
                --warning-color: #d97706;
                --info-color: #2563eb;
                --success-bg: rgba(5, 150, 105, 0.08);
                --error-bg: rgba(220, 38, 38, 0.06);
                --warning-bg: rgba(217, 119, 6, 0.08);
                --info-bg: rgba(37, 99, 235, 0.06);
                --admin-badge: #d97706;
                --role-admin: #d97706;
                --role-super: #dc2626;
                --role-mod: #2563eb;
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --border-field-focus: #ffffff;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --info-color: #3b82f6;
                --success-bg: rgba(16, 185, 129, 0.1);
                --error-bg: rgba(239, 68, 68, 0.1);
                --warning-bg: rgba(245, 158, 11, 0.1);
                --info-bg: rgba(59, 130, 246, 0.1);
                --admin-badge: #f59e0b;
                --role-admin: #f59e0b;
                --role-super: #ef4444;
                --role-mod: #3b82f6;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-field);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== HEADER ADMIN ========== */
        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 2px solid var(--admin-badge);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.5s ease;
        }

        .admin-header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .admin-logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--admin-badge);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #000000;
        }

        .admin-logo-text {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .admin-badge {
            display: inline-block;
            background: var(--warning-bg);
            border: 1px solid var(--warning-color);
            border-radius: 15px;
            padding: 0.25rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--warning-color);
            letter-spacing: 0.3px;
        }

        .admin-nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .admin-nav-link {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .admin-nav-link:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .admin-nav-link.active {
            background: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
            font-weight: 600;
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.35rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        /* ========== CONTEÚDO ========== */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .btn-add {
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* ========== GRID DE ADMINISTRADORES ========== */
        .admins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            transition: all 0.35s ease;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            position: relative;
        }

        .admin-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card);
            border-color: var(--text-secondary);
        }

        .admin-card.super {
            border-left: 4px solid var(--role-super);
        }

        .admin-card.admin {
            border-left: 4px solid var(--role-admin);
        }

        .admin-card.mod {
            border-left: 4px solid var(--role-mod);
        }

        .admin-header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .admin-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--bg-field);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .admin-info {
            flex: 1;
            min-width: 0;
        }

        .admin-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-email {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .role-badge {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 0.8rem;
        }

        .role-badge.super {
            background: var(--error-bg);
            color: var(--role-super);
        }

        .role-badge.admin {
            background: var(--warning-bg);
            color: var(--role-admin);
        }

        .role-badge.mod {
            background: var(--info-bg);
            color: var(--role-mod);
        }

        .admin-meta {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }

        .admin-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-meta-label {
            color: var(--text-secondary);
        }

        .admin-meta-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .admin-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 10px;
            padding: 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .btn-action:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        .btn-action.edit {
            background: var(--info-bg);
            border-color: var(--info-color);
            color: var(--info-color);
        }

        .btn-action.remove {
            color: var(--error-color);
        }

        .btn-action.remove:hover {
            background: var(--error-bg);
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .admin-header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .admin-nav {
                width: 100%;
                justify-content: center;
            }

            .admin-container {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admins-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.3rem;
            }

            .btn-add {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- HEADER ADMIN -->
    <header class="admin-header">
        <div class="admin-header-container">
            <a href="admin-dashboard.html" class="admin-logo">
                <div class="admin-logo-icon">⚡</div>
                <span class="admin-logo-text">Admin StreamPremium</span>
                <span class="admin-badge">🔒 PAINEL</span>
            </a>

            <div class="admin-nav">
                <a href="admin-dashboard.html" class="admin-nav-link">📊 Dashboard</a>
                <a href="usuarios.html" class="admin-nav-link">👥 Usuários</a>
                <a href="administradores.html" class="admin-nav-link active">🛡 Administradores</a>
                <a href="configuracoes.html" class="admin-nav-link">⚙️ Config</a>
            </div>

            <div class="theme-selector">
                <button class="theme-option" data-theme-option="dark" type="button">🌙</button>
                <button class="theme-option" data-theme-option="light" type="button">☀️</button>
                <button class="theme-option active" data-theme-option="system" type="button">💻</button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="admin-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Administradores</h1>
                <p class="page-subtitle">Gerencie a equipe administrativa da plataforma</p>
            </div>
            <button class="btn-add" id="btnAddAdmin">
                ➕ Adicionar administrador
            </button>
        </div>

        <!-- GRID DE ADMINISTRADORES -->
        <div class="admins-grid" id="adminsGrid">
            <!-- Gerado dinamicamente -->
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_admin_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS SIMULADOS ==========
            let administradores = [
                { id: 1, nome: 'Carlos Eduardo', email: 'carlos@streampremium.com', cargo: 'Super Administrador', nivel: 'super', ultimoAcesso: '15/12/2024 14:30', criadoEm: '01/01/2024' },
                { id: 2, nome: 'Ana Beatriz', email: 'ana@streampremium.com', cargo: 'Administrador', nivel: 'admin', ultimoAcesso: '15/12/2024 10:15', criadoEm: '15/03/2024' },
                { id: 3, nome: 'Pedro Henrique', email: 'pedro@streampremium.com', cargo: 'Moderador', nivel: 'mod', ultimoAcesso: '14/12/2024 22:00', criadoEm: '20/06/2024' },
                { id: 4, nome: 'Mariana Costa', email: 'mariana@streampremium.com', cargo: 'Administrador', nivel: 'admin', ultimoAcesso: '14/12/2024 18:45', criadoEm: '10/08/2024' },
            ];

            // ========== ELEMENTOS ==========
            const adminsGrid = document.getElementById('adminsGrid');
            const btnAddAdmin = document.getElementById('btnAddAdmin');

            // ========== RENDERIZAR ADMINISTRADORES ==========
            function renderizarAdministradores() {
                adminsGrid.innerHTML = '';

                administradores.forEach((admin, index) => {
                    const card = document.createElement('div');
                    card.className = 'admin-card ' + admin.nivel;
                    card.style.animationDelay = (index * 0.08) + 's';

                    const nivelLabel = admin.nivel === 'super' ? 'Super Admin' : 
                                      admin.nivel === 'admin' ? 'Administrador' : 'Moderador';
                    
                    const nivelIcon = admin.nivel === 'super' ? '👑' : 
                                     admin.nivel === 'admin' ? '🛡' : '🔧';

                    card.innerHTML = `
                        <div class="admin-header-info">
                            <div class="admin-avatar">👤</div>
                            <div class="admin-info">
                                <p class="admin-name">${admin.nome}</p>
                                <p class="admin-email">${admin.email}</p>
                            </div>
                        </div>

                        <span class="role-badge ${admin.nivel}">
                            ${nivelIcon} ${nivelLabel}
                        </span>

                        <div class="admin-meta">
                            <div class="admin-meta-row">
                                <span class="admin-meta-label">Último acesso:</span>
                                <span class="admin-meta-value">${admin.ultimoAcesso}</span>
                            </div>
                            <div class="admin-meta-row">
                                <span class="admin-meta-label">Criado em:</span>
                                <span class="admin-meta-value">${admin.criadoEm}</span>
                            </div>
                        </div>

                        <div class="admin-actions">
                            <button class="btn-action edit" data-id="${admin.id}">
                                ✏️ Editar
                            </button>
                            <button class="btn-action remove" data-id="${admin.id}">
                                🗑 Remover
                            </button>
                        </div>
                    `;

                    adminsGrid.appendChild(card);
                });

                // Eventos
                document.querySelectorAll('.btn-action.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        alert('Editar administrador ID: ' + id);
                    });
                });

                document.querySelectorAll('.btn-action.remove').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        if (confirm('Remover este administrador?')) {
                            administradores = administradores.filter(a => a.id !== id);
                            renderizarAdministradores();
                        }
                    });
                });
            }

            // ========== ADICIONAR ADMINISTRADOR ==========
            btnAddAdmin.addEventListener('click', function() {
                alert('Adicionar administrador - formulário em desenvolvimento');
            });

            // ========== INICIALIZAR ==========
            renderizarAdministradores();
        })();
    </script>
</body>
</html>
