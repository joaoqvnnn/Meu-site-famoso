<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Gerenciar Produtos | Admin StreamPremium</title>
    <style>
        :root {
            --radius-card: 20px;
            --radius-btn: 14px;
            --radius-field: 12px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ========== TEMA PRETO ========== */
        body[data-theme="dark"] {
            --bg-page: #0a0a0a;
            --bg-card: #111111;
            --bg-field: #1a1a1a;
            --bg-field-hover: #222222;
            --border-field: #2a2a2a;
            --border-field-focus: #ffffff;
            --text-primary: #f5f5f5;
            --text-secondary: #a1a1a1;
            --text-placeholder: #666666;
            --text-btn: #000000;
            --bg-btn: #ffffff;
            --bg-btn-hover: #e6e6e6;
            --text-link: #f5f5f5;
            --icon-color: #a1a1a1;
            --border-mix: #2a2a2a;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --success-bg: rgba(16, 185, 129, 0.1);
            --error-bg: rgba(239, 68, 68, 0.1);
            --warning-bg: rgba(245, 158, 11, 0.1);
            --info-bg: rgba(59, 130, 246, 0.1);
            --admin-badge: #f59e0b;
            --rating-color: #f59e0b;
        }

        /* ========== TEMA BRANCO ========== */
        body[data-theme="light"] {
            --bg-page: #fafafa;
            --bg-card: #ffffff;
            --bg-field: #f5f5f5;
            --bg-field-hover: #eeeeee;
            --border-field: #e4e4e4;
            --border-field-focus: #171717;
            --text-primary: #171717;
            --text-secondary: #555555;
            --text-placeholder: #9ca3af;
            --text-btn: #ffffff;
            --bg-btn: #171717;
            --bg-btn-hover: #2c2c2c;
            --text-link: #171717;
            --icon-color: #555555;
            --border-mix: #e4e4e4;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --info-color: #2563eb;
            --success-bg: rgba(5, 150, 105, 0.08);
            --error-bg: rgba(220, 38, 38, 0.06);
            --warning-bg: rgba(217, 119, 6, 0.08);
            --info-bg: rgba(37, 99, 235, 0.06);
            --admin-badge: #d97706;
            --rating-color: #d97706;
        }

        /* ========== TEMA SISTEMA ========== */
        @media (prefers-color-scheme: light) {
            body[data-theme="system"] {
                --bg-page: #fafafa;
                --bg-card: #ffffff;
                --bg-field: #f5f5f5;
                --bg-field-hover: #eeeeee;
                --border-field: #e4e4e4;
                --border-field-focus: #171717;
                --text-primary: #171717;
                --text-secondary: #555555;
                --text-placeholder: #9ca3af;
                --text-btn: #ffffff;
                --bg-btn: #171717;
                --bg-btn-hover: #2c2c2c;
                --text-link: #171717;
                --icon-color: #555555;
                --border-mix: #e4e4e4;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.08);
                --success-color: #059669;
                --error-color: #dc2626;
                --warning-color: #d97706;
                --info-color: #2563eb;
                --success-bg: rgba(5, 150, 105, 0.08);
                --error-bg: rgba(220, 38, 38, 0.06);
                --warning-bg: rgba(217, 119, 6, 0.08);
                --info-bg: rgba(37, 99, 235, 0.06);
                --admin-badge: #d97706;
                --rating-color: #d97706;
            }
        }

        @media (prefers-color-scheme: dark) {
            body[data-theme="system"] {
                --bg-page: #0a0a0a;
                --bg-card: #111111;
                --bg-field: #1a1a1a;
                --bg-field-hover: #222222;
                --border-field: #2a2a2a;
                --border-field-focus: #ffffff;
                --text-primary: #f5f5f5;
                --text-secondary: #a1a1a1;
                --text-placeholder: #666666;
                --text-btn: #000000;
                --bg-btn: #ffffff;
                --bg-btn-hover: #e6e6e6;
                --text-link: #f5f5f5;
                --icon-color: #a1a1a1;
                --border-mix: #2a2a2a;
                --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.5);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --info-color: #3b82f6;
                --success-bg: rgba(16, 185, 129, 0.1);
                --error-bg: rgba(239, 68, 68, 0.1);
                --warning-bg: rgba(245, 158, 11, 0.1);
                --info-bg: rgba(59, 130, 246, 0.1);
                --admin-badge: #f59e0b;
                --rating-color: #f59e0b;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.35s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-field);
            border-radius: 4px;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        /* ========== HEADER ADMIN ========== */
        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 2px solid var(--admin-badge);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.5s ease;
        }

        .admin-header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .admin-logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--admin-badge);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #000000;
        }

        .admin-logo-text {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .admin-badge {
            display: inline-block;
            background: var(--warning-bg);
            border: 1px solid var(--warning-color);
            border-radius: 15px;
            padding: 0.25rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--warning-color);
            letter-spacing: 0.3px;
        }

        .admin-nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .admin-nav-link {
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .admin-nav-link:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .admin-nav-link.active {
            background: var(--bg-btn);
            color: var(--text-btn);
            border-color: var(--bg-btn);
            font-weight: 600;
        }

        .theme-selector {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-field);
            border-radius: 25px;
            padding: 0.3rem;
            border: 1px solid var(--border-mix);
        }

        .theme-option {
            background: transparent;
            border: none;
            border-radius: 20px;
            padding: 0.35rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-option:hover {
            color: var(--text-primary);
        }

        .theme-option.active {
            background-color: var(--bg-btn);
            color: var(--text-btn);
            font-weight: 600;
        }

        /* ========== CONTEÚDO ========== */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .btn-add {
            background: var(--bg-btn);
            color: var(--text-btn);
            border: none;
            border-radius: var(--radius-btn);
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-add:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        /* ========== ESTATÍSTICAS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.2rem;
            text-align: center;
        }

        .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ========== BUSCA ========== */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-field);
            border: 1px solid var(--border-mix);
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 3px rgba(128, 128, 128, 0.08);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            font-family: var(--font-sans);
        }

        /* ========== GRID DE PRODUTOS ========== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-mix);
            border-radius: var(--radius-card);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.35s ease;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card);
            border-color: var(--text-secondary);
        }

        .product-card.removing {
            animation: slideOut 0.3s ease forwards;
        }

        .product-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .product-poster {
            width: 55px;
            height: 75px;
            background: var(--bg-field);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .product-header-info {
            flex: 1;
            min-width: 0;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        .product-type {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .product-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info-label {
            color: var(--text-secondary);
        }

        .product-info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--rating-color);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .btn-action {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-mix);
            border-radius: 10px;
            padding: 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .btn-action:hover {
            background: var(--bg-field);
            border-color: var(--text-secondary);
        }

        .btn-action.edit {
            background: var(--info-bg);
            border-color: var(--info-color);
            color: var(--info-color);
        }

        .btn-action.edit:hover {
            background: var(--info-bg);
            border-color: var(--info-color);
        }

        .btn-action.delete {
            color: var(--error-color);
        }

        .btn-action.delete:hover {
            background: var(--error-bg);
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .admin-header-container {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 0.75rem;
            }

            .admin-nav {
                width: 100%;
                justify-content: center;
            }

            .admin-container {
                padding: 1.5rem 1rem;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.3rem;
            }

            .btn-add {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body data-theme="system">

    <!-- HEADER ADMIN -->
    <header class="admin-header">
        <div class="admin-header-container">
            <a href="admin-dashboard.html" class="admin-logo">
                <div class="admin-logo-icon">⚡</div>
                <span class="admin-logo-text">Admin StreamPremium</span>
                <span class="admin-badge">🔒 PAINEL</span>
            </a>

            <div class="admin-nav">
                <a href="admin-dashboard.html" class="admin-nav-link">📊 Dashboard</a>
                <a href="usuarios.html" class="admin-nav-link">👥 Usuários</a>
                <a href="produtos.html" class="admin-nav-link active">🎬 Produtos</a>
                <a href="admin-pedidos.html" class="admin-nav-link">📦 Pedidos</a>
                <a href="admin-config.html" class="admin-nav-link">⚙️ Config</a>
            </div>

            <div class="theme-selector">
                <button class="theme-option" data-theme-option="dark" type="button">🌙</button>
                <button class="theme-option" data-theme-option="light" type="button">☀️</button>
                <button class="theme-option active" data-theme-option="system" type="button">💻</button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="admin-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Gerenciar Produtos</h1>
                <p class="page-subtitle">Adicione, edite e remova títulos da plataforma</p>
            </div>
            <button class="btn-add" id="btnAddProduct">
                ➕ Adicionar produto
            </button>
        </div>

        <!-- ESTATÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎬</div>
                <div class="stat-value" id="statTotal">156</div>
                <div class="stat-label">Total de produtos</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎥</div>
                <div class="stat-value" id="statFilmes">89</div>
                <div class="stat-label">Filmes</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📺</div>
                <div class="stat-value" id="statSeries">45</div>
                <div class="stat-label">Séries</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📄</div>
                <div class="stat-value" id="statDocs">22</div>
                <div class="stat-label">Documentários</div>
            </div>
        </div>

        <!-- BUSCA -->
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchProduct" placeholder="Buscar por título, categoria ou gênero...">
        </div>

        <!-- GRID DE PRODUTOS -->
        <div class="products-grid" id="productsGrid">
            <!-- Gerado dinamicamente -->
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ========== GERENCIAMENTO DE TEMA ==========
            const body = document.body;
            const themeButtons = document.querySelectorAll('.theme-option');
            const THEME_KEY = 'streampremium_admin_theme';

            function getTemaSalvo() {
                try {
                    return localStorage.getItem(THEME_KEY) || 'system';
                } catch (e) {
                    return 'system';
                }
            }

            function aplicarTema(tema) {
                body.setAttribute('data-theme', tema);
                themeButtons.forEach(btn => {
                    const btnTema = btn.getAttribute('data-theme-option');
                    if (btnTema === tema) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                try {
                    localStorage.setItem(THEME_KEY, tema);
                } catch (e) {
                    // localStorage indisponível
                }
            }

            aplicarTema(getTemaSalvo());

            themeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    aplicarTema(this.getAttribute('data-theme-option'));
                });
            });

            if (window.matchMedia) {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleSystemChange = function() {
                    if (getTemaSalvo() === 'system') {
                        aplicarTema('system');
                    }
                };
                if (mediaQuery.addEventListener) {
                    mediaQuery.addEventListener('change', handleSystemChange);
                } else if (mediaQuery.addListener) {
                    mediaQuery.addListener(handleSystemChange);
                }
            }

            // ========== DADOS SIMULADOS ==========
            let produtos = [
                { id: 1, titulo: 'Duna: Parte 2', tipo: 'Filme', genero: 'Ficção Científica', ano: 2024, avaliacao: 8.9, preco: 29.90 },
                { id: 2, titulo: 'Breaking Bad - T1', tipo: 'Série', genero: 'Drama', ano: 2008, avaliacao: 9.5, preco: 49.90 },
                { id: 3, titulo: 'Interestelar', tipo: 'Filme', genero: 'Ficção Científica', ano: 2014, avaliacao: 8.7, preco: 19.90 },
                { id: 4, titulo: 'Stranger Things - T1', tipo: 'Série', genero: 'Terror', ano: 2016, avaliacao: 8.7, preco: 39.90 },
                { id: 5, titulo: 'Planeta Terra II', tipo: 'Documentário', genero: 'Natureza', ano: 2016, avaliacao: 9.5, preco: 34.90 },
                { id: 6, titulo: 'A Origem', tipo: 'Filme', genero: 'Ação', ano: 2010, avaliacao: 8.8, preco: 24.90 },
            ];

            // ========== ELEMENTOS ==========
            const productsGrid = document.getElementById('productsGrid');
            const searchInput = document.getElementById('searchProduct');
            const btnAddProduct = document.getElementById('btnAddProduct');

            // ========== FORMATAR PREÇO ==========
            function formatarPreco(valor) {
                return 'R$ ' + valor.toFixed(2).replace('.', ',');
            }

            // ========== RENDERIZAR PRODUTOS ==========
            function renderizarProdutos(filtro = '') {
                productsGrid.innerHTML = '';

                const produtosFiltrados = produtos.filter(produto => {
                    if (!filtro) return true;
                    const termo = filtro.toLowerCase();
                    return produto.titulo.toLowerCase().includes(termo) ||
                           produto.genero.toLowerCase().includes(termo) ||
                           produto.tipo.toLowerCase().includes(termo);
                });

                produtosFiltrados.forEach((produto, index) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.style.animationDelay = (index * 0.08) + 's';

                    card.innerHTML = `
                        <div class="product-header">
                            <div class="product-poster">🎬</div>
                            <div class="product-header-info">
                                <h3 class="product-title">${produto.titulo}</h3>
                                <p class="product-type">${produto.tipo}</p>
                            </div>
                        </div>

                        <div class="product-info">
                            <div class="product-info-row">
                                <span class="product-info-label">Gênero:</span>
                                <span class="product-info-value">${produto.genero}</span>
                            </div>
                            <div class="product-info-row">
                                <span class="product-info-label">Ano:</span>
                                <span class="product-info-value">${produto.ano}</span>
                            </div>
                            <div class="product-info-row">
                                <span class="product-info-label">Avaliação:</span>
                                <span class="product-rating">★ ${produto.avaliacao}</span>
                            </div>
                            <div class="product-info-row">
                                <span class="product-info-label">Preço:</span>
                                <span class="product-info-value">${formatarPreco(produto.preco)}</span>
                            </div>
                        </div>

                        <div class="product-actions">
                            <button class="btn-action edit" data-id="${produto.id}">
                                ✏️ Editar
                            </button>
                            <button class="btn-action delete" data-id="${produto.id}">
                                🗑 Excluir
                            </button>
                        </div>
                    `;

                    productsGrid.appendChild(card);
                });

                // Eventos
                document.querySelectorAll('.btn-action.edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        alert('Editar produto ID: ' + id);
                    });
                });

                document.querySelectorAll('.btn-action.delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        if (confirm('Excluir este produto?')) {
                            const card = this.closest('.product-card');
                            card.classList.add('removing');
                            setTimeout(() => {
                                produtos = produtos.filter(p => p.id !== id);
                                renderizarProdutos(searchInput.value);
                                atualizarEstatisticas();
                            }, 300);
                        }
                    });
                });
            }

            // ========== ATUALIZAR ESTATÍSTICAS ==========
            function atualizarEstatisticas() {
                document.getElementById('statTotal').textContent = produtos.length;
                document.getElementById('statFilmes').textContent = produtos.filter(p => p.tipo === 'Filme').length;
                document.getElementById('statSeries').textContent = produtos.filter(p => p.tipo === 'Série').length;
                document.getElementById('statDocs').textContent = produtos.filter(p => p.tipo === 'Documentário').length;
            }

            // ========== BUSCA ==========
            searchInput.addEventListener('input', function() {
                renderizarProdutos(this.value);
            });

            // ========== ADICIONAR PRODUTO ==========
            btnAddProduct.addEventListener('click', function() {
                alert('Adicionar produto - formulário em desenvolvimento');
            });

            // ========== INICIALIZAR ==========
            renderizarProdutos();
            atualizarEstatisticas();
        })();
    </script>
</body>
</html>
